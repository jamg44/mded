[package]
name = "mded"
version = "0.1.0"
description = "A native markdown editor with a hybrid live-preview mode"
authors = ["jamg44"]
license = "MIT"
repository = "https://github.com/jamg44/mded"
edition = "2024"

[lib]
# The _lib suffix avoids a lib/bin name clash on Windows
name = "mded_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
