<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mded</title>
    <script>
      // Apply theme and width before the first paint (avoids a flash of the wrong theme)
      try {
        const p = JSON.parse(localStorage.getItem('mded.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme || 'system';
        document.documentElement.dataset.width = p.width || 'readable';
      } catch {}
    </script>
  </head>
  <body>
    <div id="bar" class="bar" role="alert" hidden>
      <span id="bar-message" class="bar-message"></span>
      <span id="bar-actions" class="bar-actions"></span>
    </div>
    <main id="editor">
      <!-- Shown in Reading Mode (main.ts). Never takes focus: the text keeps it -->
      <button id="reading-pill" class="reading-pill" type="button" tabindex="-1" hidden>Reading</button>
    </main>
    <div id="notice" class="notice" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
